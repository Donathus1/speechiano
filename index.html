<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Text to Speech MVP</title>
</head>
<body>

  <h2>Text to Speech Generator</h2>

  <textarea id="text" rows="6" cols="50" placeholder="Type your text here"></textarea>
  <br><br>

  <button onclick="generate()">Generate Voice</button>

  <br><br>
  <audio id="audio" controls></audio>

 <script>
  async function generate() {
    const text = document.getElementById("text").value;
    if (!text) {
      alert("Please enter text");
      return;
    }

    const response = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=AIzaSyAxVoRrYH5YEwzilgF6DodGFiiwG4bGstM"
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          contents: [{
            parts: [{ text: text }]
          }]
        })
      }
    );

    const data = await response.json();
    console.log(data);

    alert("Request sent to Google AI Studio. Check console.");
  }
</script>


</body>
</html>
